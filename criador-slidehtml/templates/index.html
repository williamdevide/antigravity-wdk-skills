<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua Apresentação Interativa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="slides-container" id="slides-container">
        <!-- Slide 1 -->
        <div class="slide active">
            <div class="slide-content">
                <h1>Título do Primeiro Slide</h1>
                <p>Use as setas ou role para navegar.</p>
            </div>
        </div>

        <!-- Slide 2 -->
        <div class="slide">
            <div class="slide-content">
                <h2>Seu Conteúdo Aqui</h2>
                <div class="card">
                    <p>Este é um card glassmorphism pronto para uso.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <span class="slide-counter" id="slide-counter">1 / 2</span>
        <button class="btn-nav" id="btn-prev" disabled>&#8592;</button>
        <button class="btn-nav" id="btn-next">&#8594;</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
